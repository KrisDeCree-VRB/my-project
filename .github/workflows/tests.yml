name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restoring the test project pulls in the web project it references.
      - name: Restore
        run: dotnet restore tests/my-project.Tests

      - name: Build
        run: dotnet build tests/my-project.Tests --configuration Release --no-restore

      # The GitHubActions logger writes a pass/fail table to the run summary and
      # annotates failing tests inline; the trx is kept as a downloadable record.
      - name: Test
        run: >
          dotnet test tests/my-project.Tests
          --configuration Release
          --no-build
          --logger "GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
